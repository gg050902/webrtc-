<!DOCTYPE html>
<!-- ════════════════════════════════════════════════════════════════
  recordings.html —— 录制回放页（G3，09-19c · "录了能看"的最后一公里）

▎这是什么？
  D+2 服务器侧录制的产物此前只能"下载到本地用播放器打开"；本页把它变成
  会议系统里的真功能：/api/recordings 列出产物 → 点开直接 <video> 播放。
  零依赖手写（风格与 /dashboard 同一套暖墨 token），数据源与面板同哲学：
  服务器给真相（文件系统），展示层只渲染。

▎怎么用？
  服务器启动后访问 http://localhost:3001/recordings.html
  （成员行 ⏺ 录一段 → 回本页刷新 → 点文件名播放/下载）。
═════════════════════════════════════════════════════════════════ -->
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>录制回放 · SFU</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "Noto Serif SC", "Segoe UI", "PingFang SC", "Microsoft YaHei", serif;
      background: linear-gradient(160deg, #14100a 0%, #1c1710 100%);
      color: #ece5d8; min-height: 100vh; padding: 24px;
    }
    h1 { font-size: 20px; display: flex; align-items: center; gap: 10px; margin-bottom: 4px; }
    h1 .dot { width: 9px; height: 9px; border-radius: 50%; background: #d8b36a; box-shadow: 0 0 8px #d8b36a; }
    .sub { color: #8a8070; font-size: 12px; margin-bottom: 20px; }
    .sub a { color: #d8b36a; text-decoration: none; }
    .sub a:hover { text-decoration: underline; }
    .wrap { display: grid; grid-template-columns: minmax(260px, 380px) 1fr; gap: 18px; }
    @media (max-width: 860px) { .wrap { grid-template-columns: 1fr; } }
    .list {
      background: #1c1710; border: 1px solid #3a3226; border-radius: 12px;
      overflow-y: auto; max-height: 70vh;
    }
    .item {
      display: flex; align-items: center; gap: 10px;
      padding: 10px 14px; border-bottom: 1px solid #2a2318;
      cursor: pointer; transition: background .12s;
    }
    .item:last-child { border-bottom: none; }
    .item:hover { background: rgba(216, 179, 106, .07); }
    .item.active { background: rgba(216, 179, 106, .12); }
    .item .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13px; }
    .item .sz { font-size: 11px; color: #8a8070; font-variant-numeric: tabular-nums; }
    .player {
      background: #1c1710; border: 1px solid #3a3226; border-radius: 12px;
      padding: 16px; display: flex; flex-direction: column; gap: 10px;
      box-shadow: 0 8px 24px rgba(6,4,2,.4);
    }
    video { width: 100%; border-radius: 8px; background: #14100a; min-height: 300px; }
    .meta { font-size: 12px; color: #b8ac95; display: flex; gap: 16px; flex-wrap: wrap; }
    .meta a { color: #d8b36a; }
    .empty { color: #8a8070; font-size: 14px; text-align: center; padding: 60px 0; }
    .empty .big { font-size: 40px; margin-bottom: 10px; }
  </style>
</head>
<body>
  <h1><span class="dot"></span>录制回放</h1>
  <div class="sub">D+2 服务器侧录制产物 · 点左侧文件名播放 · <a href="/dashboard">← 观测面板</a> · <a href="/">会议页</a></div>
  <div class="wrap">
    <div class="list" id="list"><div class="empty"><div class="big">⏳</div>正在加载…</div></div>
    <div class="player" id="playerBox">
      <div class="empty" id="hint"><div class="big">📼</div>先在会议里录一段（成员行 ⏺），再回这里播放</div>
      <video id="video" controls class="hidden"></video>
      <div class="meta hidden" id="meta"></div>
    </div>
  </div>
  <script>
    /* ★ 09-24 G8：录制产物现在是受保护资源（只对管理员开放）。
     * ▎token 取自会议页登录后写下的同一份 localStorage（键 wb_auth），不另起键。
     * ▎列表接口能带 Authorization 头；但 <video src> 和 <a download> 发不出自定义头，
     *   所以它们的 URL 只能拼 ?token= —— 这正是服务端支持查询串兜底的原因。
     *   ▎权衡：URL 里的 token 会进浏览器历史/服务器日志，仅作兜底。 */
    const token = (() => {
      try { return (JSON.parse(localStorage.getItem('wb_auth') || '{}') || {}).token || ''; }
      catch (e) { return ''; }
    })();
    const withToken = (url) => token ? url + (url.includes('?') ? '&' : '?') + 'token=' + encodeURIComponent(token) : url;

    function showAuthGuide() {
      const listEl = document.getElementById('list');
      listEl.innerHTML = `
        <div class="empty" style="text-align:left;padding:28px 20px;line-height:1.9">
          <div class="big" style="text-align:center">🔒</div>
          <div style="text-align:center;font-size:15px;font-weight:700;margin-bottom:8px">录制回放需要管理员身份</div>
          <div style="color:#8a8070;font-size:13px">
            录制文件里可能有会议画面与声音，所以只对管理员开放。<br>
            请先用管理员账号登录，再回到本页。
          </div>
          <div style="margin-top:16px;text-align:center">
            <a href="/" style="color:#d8b36a">去登录 →</a>
          </div>
        </div>`;
    }

    (async () => {
      const listEl = document.getElementById('list');
      let items = [];
      let res;
      try {
        res = await fetch('/api/recordings', { headers: token ? { Authorization: 'Bearer ' + token } : {} });
      } catch (e) {
        listEl.innerHTML = '<div class="empty"><div class="big">⚠️</div>列表加载失败</div>';
        return;
      }
      if (res.status === 401) { showAuthGuide(); return; }
      try { items = await res.json(); } catch (e) { items = []; }
      if (!Array.isArray(items)) items = [];
      if (!items.length) {
        listEl.innerHTML = '<div class="empty"><div class="big">📼</div>还没有录制——进会议点成员行的 ⏺ 录一段</div>';
        return;
      }
      listEl.textContent = '';
      const fmt = (n) => n > 1048576 ? (n / 1048576).toFixed(1) + ' MB' : Math.max(1, Math.round(n / 1024)) + ' KB';
      for (const it of items) {
        const row = document.createElement('div');
        row.className = 'item';
        const nm = document.createElement('span');
        nm.className = 'nm';
        nm.textContent = it.name;
        const sz = document.createElement('span');
        sz.className = 'sz';
        sz.textContent = fmt(it.size);
        row.appendChild(nm);
        row.appendChild(sz);
        row.addEventListener('click', () => {
          listEl.querySelectorAll('.item').forEach((x) => x.classList.remove('active'));
          row.classList.add('active');
          const v = document.getElementById('video');
          // ★ 受保护资源：必须带 token（video/download 发不出请求头，只能走查询串）
          const mediaUrl = withToken('/recordings/' + encodeURIComponent(it.name));
          v.src = mediaUrl;
          v.classList.remove('hidden');
          v.play().catch(() => {}); // 自动播失败（浏览器策略）就等用户手点
          const meta = document.getElementById('meta');
          meta.classList.remove('hidden');
          meta.textContent = '';
          const a = document.createElement('a');
          a.href = mediaUrl; a.download = it.name;
          a.textContent = '⬇ 下载 ' + it.name;
          const t = document.createElement('span');
          t.textContent = fmt(it.size) + ' · ' + new Date(it.mtime).toLocaleString();
          meta.appendChild(a);
          meta.appendChild(t);
          document.getElementById('hint').classList.add('hidden');
        });
        listEl.appendChild(row);
      }
    })();
  </script>
</body>
</html>
