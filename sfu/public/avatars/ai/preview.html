<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI 小明 · 矢量表情演示</title>
  <!-- ★ 演示页不自绘头像：样式直接链接生产 style.css，SVG 运行时从 client.js 的
       aiAvatarSvg() 抽取——与会议页永远同一份（坑 47：一个概念只有一个来源）。 -->
  <link rel="stylesheet" href="../../style.css?v=20261007">
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 56px 24px 80px;
      background: #0e0c0a; color: #f0ebe3;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      display: flex; flex-direction: column; align-items: center;
    }
    h1 {
      margin: 0 0 8px; font-size: 24px; font-weight: 600; letter-spacing: .04em;
    }
    h1 .en {
      display: block; margin-top: 6px;
      font-size: 11px; font-weight: 500; letter-spacing: .28em;
      color: rgba(216, 179, 106, .8); text-transform: uppercase;
    }
    .pv-sub {
      margin: 0 0 40px; max-width: 560px; text-align: center;
      color: rgba(240, 235, 227, .62); font-size: 13.5px; line-height: 1.8;
    }
    .pv-sub code { color: #d8b36a; font-size: 12.5px; }

    .pv-stage { display: flex; gap: 48px; align-items: flex-start; flex-wrap: wrap; justify-content: center; }

    /* 演示格：用生产类名（ai-tile / ai-face-wrap），生产 CSS 原样生效 */
    .pv-tile {
      position: relative; width: 320px; height: 320px;
      background: #171209;
      border: 1px solid rgba(216, 179, 106, .14);
      border-radius: 20px; overflow: hidden;
    }
    .pv-tile .video-label {
      position: absolute; left: 0; right: 0; bottom: 0;
      padding: 10px 14px; font-size: 13px; color: rgba(240, 235, 227, .85);
      background: linear-gradient(transparent, rgba(0, 0, 0, .55));
      display: flex; align-items: center; gap: 8px;
    }
    .pv-tile .ai-status {
      margin-left: 2px; padding: 1px 8px; font-size: 10px; color: #d8b36a;
      background: rgba(216, 179, 106, .14); border-radius: 999px;
    }

    .pv-panel { display: flex; flex-direction: column; gap: 20px; }
    .pv-panel h2 {
      margin: 0 0 10px; font-size: 12px; font-weight: 600;
      letter-spacing: .18em; color: rgba(240, 235, 227, .45); text-transform: uppercase;
    }
    .pv-btns { display: flex; flex-direction: column; gap: 8px; width: 220px; }
    .pv-btn {
      appearance: none; border: 1px solid rgba(216, 179, 106, .25);
      background: #1f1a13; color: #f0ebe3;
      padding: 10px 16px; border-radius: 12px;
      font-size: 13.5px; text-align: left; cursor: pointer;
      transition: background .2s, border-color .2s, transform .1s;
      display: flex; justify-content: space-between; align-items: center; gap: 8px;
    }
    .pv-btn:hover { background: #29221a; }
    .pv-btn:active { transform: scale(.985); }
    .pv-btn .k { font-size: 11px; color: rgba(240, 235, 227, .4); font-family: ui-monospace, Consolas, monospace; }
    .pv-btn.on { border-color: rgba(216, 179, 106, .65); background: rgba(216, 179, 106, .12); }
    .pv-btn.on .k { color: #d8b36a; }

    /* 成员行小头像（生产 .member-row / .ai-av 同款结构） */
    .pv-row {
      display: flex; align-items: center; gap: 10px;
      padding: 10px 14px; width: 220px;
      background: #1f1a13; border: 1px solid rgba(216, 179, 106, .14);
      border-radius: 12px; font-size: 13px;
    }
    .pv-row .m-bot-note { margin-left: auto; font-size: 11px; color: rgba(240, 235, 227, .45); }

    .pv-foot {
      margin-top: 48px; max-width: 560px; text-align: center;
      color: rgba(240, 235, 227, .38); font-size: 12px; line-height: 1.9;
    }
    .pv-foot code { color: rgba(216, 179, 106, .75); font-size: 11.5px; }
  </style>
</head>
<body>
  <h1>AI 小明<span class="en">Vector Avatar · Live States</span></h1>
  <p class="pv-sub">
    内联 SVG 矢量脸：眼 / 眉 / 嘴 / 腮红是独立元素，状态由格子类驱动变形——
    <code>.speaking</code> 张嘴、<code>.thinking</code> 凝神、<code>.happy</code> 笑。
    眨眼与呼吸常驻，无需切换任何素材。
  </p>

  <div class="pv-stage">
    <div class="pv-tile ai-tile" id="tile" style="width:320px;height:320px;aspect-ratio:auto">
      <div class="ai-face-wrap" role="img" aria-label="AI 小明"></div>
      <div class="video-label">AI 小明<span class="ai-status" id="statusChip">聆听中…</span></div>
    </div>

    <div class="pv-panel">
      <section>
        <h2>状态</h2>
        <div class="pv-btns" id="btns">
          <button class="pv-btn on" data-st="">聆听 / 静置 <span class="k">calm</span></button>
          <button class="pv-btn" data-st="thinking">思考 <span class="k">.thinking</span></button>
          <button class="pv-btn" data-st="speaking">说话 <span class="k">.speaking</span></button>
          <button class="pv-btn" data-st="happy">开心 <span class="k">.happy</span></button>
        </div>
      </section>
      <section>
        <h2>成员行小头像</h2>
        <div class="pv-row member-row">
          <span class="ai-av" id="rowAv"></span>
          <span>AI 小明</span>
          <span class="m-bot-note">24px 徽章</span>
        </div>
      </section>
    </div>
  </div>

  <p class="pv-foot">
    本页不持有头像代码：SVG 运行时抽取自 <code>client.js · aiAvatarSvg()</code>，
    样式来自 <code>style.css</code> 第 27 节——这里看到的与会议里跑的是同一份。
  </p>

  <script>
    (async () => {
      const src = await (await fetch('../../client.js', { cache: 'no-store' })).text();
      const m = src.match(/function aiAvatarSvg\(\) \{[\s\S]*?\n\}/);
      if (!m) { document.body.innerHTML = '<p style="color:#e0636f">抽取 aiAvatarSvg() 失败：client.js 结构变了？</p>'; return; }
      const aiAvatarSvg = new Function(m[0] + '; return aiAvatarSvg;')();

      const tile = document.getElementById('tile');
      const rowAv = document.getElementById('rowAv');
      const chip = document.getElementById('statusChip');
      const LABEL = { '': '聆听中…', thinking: '思考中…', speaking: '正在发言…', happy: '完成！' };

      tile.querySelector('.ai-face-wrap').innerHTML = aiAvatarSvg();
      rowAv.innerHTML = aiAvatarSvg();

      document.getElementById('btns').addEventListener('click', (e) => {
        const b = e.target.closest('.pv-btn');
        if (!b) return;
        const st = b.dataset.st;
        for (const x of b.parentElement.children) x.classList.toggle('on', x === b);
        tile.classList.toggle('thinking', st === 'thinking');
        tile.classList.toggle('speaking', st === 'speaking');
        tile.classList.toggle('happy', st === 'happy');
        rowAv.classList.toggle('speaking', st === 'speaking');
        chip.textContent = LABEL[st] || LABEL[''];
      });
    })();
  </script>
</body>
</html>
