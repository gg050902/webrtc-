<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100"
     style="color:#0a0a0a;--face1:#fffdf9;--face2:#f2e7d5" fill="none" role="img" aria-label="AI 助理头像">
  <title>AI 助理头像</title>

  <defs>
    <linearGradient id="faceG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="var(--face1,#fffdf9)"/>
      <stop offset="100%" stop-color="var(--face2,#f2e7d5)"/>
    </linearGradient>
  </defs>

  <style>
    /* 周期刻意错开（互不成整数倍），永不同步，看着才像活的 */
    .av    { animation: float 5.4s ease-in-out infinite; transform-origin: 50% 62%; }
    .head  { animation: tilt  7.3s ease-in-out infinite; transform-origin: 50px 84px; }
    .eyes  { animation: blink 4.7s ease-in-out infinite; transform-origin: 50px 50px; }
    .brow  { animation: brow  8.9s ease-in-out infinite; }
    .blush { animation: blush 5.4s ease-in-out infinite; }

    /* 默认：待机 */
    .b-up, .b-down, .e-curve { display: none; }
    .m-open, .m-flat, .m-laugh { display: none; }

    /* 倾听：挑眉 + 抿嘴 */
    .st-listen .b-normal { display: none; }
    .st-listen .b-up     { display: block; }
    .st-listen .m-smile  { display: none; }
    .st-listen .m-flat   { display: block; }
    .st-listen .head     { animation-duration: 9.7s; }

    /* 说话：嘴开合 */
    .st-speak .m-smile { display: none; }
    .st-speak .m-open  { display: block;
                         animation: talk .54s ease-in-out infinite; transform-origin: 50px 70.8px; }
    .st-speak .head    { animation-duration: 3.1s; }
    .st-speak .eyes    { animation-duration: 3.7s; }

    /* 思考：微蹙 + 抿嘴 */
    .st-think .b-normal { display: none; }
    .st-think .b-down   { display: block; }
    .st-think .m-smile  { display: none; }
    .st-think .m-flat   { display: block; }
    .st-think .head     { animation-duration: 12.1s; }

    /* 愉悦：弯眼 + 大笑 */
    .st-happy .e-open   { display: none; }
    .st-happy .e-curve  { display: block; }
    .st-happy .m-smile  { display: none; }
    .st-happy .m-laugh  { display: block; }
    .st-happy .head     { animation-duration: 2.7s; }
    .st-happy .blush    { animation-duration: 2.7s; }

    @keyframes float { 0%,100%{transform:translateY(0)}     50%{transform:translateY(-2.4%)} }
    @keyframes tilt  { 0%,100%{transform:rotate(-1.6deg)}   50%{transform:rotate(1.6deg)} }
    @keyframes blink { 0%,91%,100%{transform:scaleY(1)}     94.5%{transform:scaleY(.06)} }
    @keyframes brow  { 0%,86%,100%{transform:translateY(0)} 91%{transform:translateY(-1.3px)} }
    @keyframes blush { 0%,100%{opacity:.72}                 50%{opacity:1} }
    @keyframes talk  { 0%,100%{transform:scaleY(.5)} 45%{transform:scaleY(1.18)} 70%{transform:scaleY(.82)} }

    @media (prefers-reduced-motion: reduce) {
      .av, .head, .eyes, .brow, .blush, .m-open { animation: none !important; }
    }
  </style>

  <g class="av">
    <g class="head">
      <!-- 脸：V 脸带尖下巴（照参考照清晰的下颌线） -->
      <path d="M26 42 Q26 22 50 22 Q74 22 74 42 L73 54 Q69 76 50 79.5 Q31 76 27 54 Z"
            fill="url(#faceG)" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round"/>
      <!-- 耳 -->
      <path d="M26.4 47 Q22.8 50.6 26.6 54" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
      <path d="M73.6 47 Q77.2 50.6 73.4 54" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
      <!-- 发：蓬松中分，M 形刘海，外轮廓带空气感（参考照的标志性发型） -->
      <path d="M50 30 Q42 32 34 40 Q26 36 24 48 Q23 26 38 17 Q50 11 62 17 Q77 26 76 48
               Q74 36 66 40 Q58 32 50 30 Z"
            fill="currentColor"/>
      <!-- 发丝：亮色细线，点出蓬松的方向与层次 -->
      <g class="comb" opacity=".32">
        <path d="M36 22 Q42 30 39 40" stroke="var(--face1,#fffdf9)" stroke-width="1" fill="none" stroke-linecap="round"/>
        <path d="M64 22 Q58 30 61 40" stroke="var(--face1,#fffdf9)" stroke-width="1" fill="none" stroke-linecap="round"/>
        <path d="M50 13 Q50 22 50 28" stroke="var(--face1,#fffdf9)" stroke-width="1" fill="none" stroke-linecap="round"/>
      </g>

      <g class="blush">
        <ellipse cx="33.8" cy="57" rx="6" ry="3.2" fill="#ff7a17" opacity=".12"/>
        <ellipse cx="66.2" cy="57" rx="6" ry="3.2" fill="#ff7a17" opacity=".12"/>
      </g>

      <!-- 眉：自然平缓（照参考照，非上扬剑眉） -->
      <g class="brow b-normal">
        <path d="M34 42.6 Q39.6 40.2 45.2 41.8" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
        <path d="M54.8 41.8 Q60.4 40.2 66 42.6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
      </g>
      <g class="brow b-up">
        <path d="M34 40.6 Q39.6 37.6 45.2 39.2" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
        <path d="M54.8 39.2 Q60.4 37.6 66 40.6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
      </g>
      <g class="brow b-down">
        <path d="M34 44.4 Q39.6 42.8 45.2 43.6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
        <path d="M54.8 43.6 Q60.4 42.8 66 44.4" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
      </g>

      <g class="eyes e-open">
        <!-- 左眼：平行双眼皮（上眼睑上方多一条平行线）+ 双高光 -->
        <ellipse cx="40.5" cy="50" rx="4.5" ry="3.6" fill="currentColor"/>
        <path d="M35.2 48.8 Q40.5 44.6 45.8 48.8" stroke="currentColor" stroke-width="2.2" fill="none" stroke-linecap="round"/>
        <path d="M35.6 46.4 Q40.5 42.6 45.6 46.4" stroke="currentColor" stroke-width="1.2" fill="none"
              stroke-linecap="round" opacity=".7"/>
        <path d="M36.2 52.8 Q40.5 54.8 44.8 52.8" stroke="currentColor" stroke-width="1" fill="none"
              stroke-linecap="round" opacity=".65"/>
        <circle cx="38.8" cy="48.8" r="1.5" fill="var(--face1,#fffdf9)"/>
        <circle cx="42.7" cy="51.8" r="0.6" fill="var(--face1,#fffdf9)" opacity=".6"/>
        <!-- 右眼 -->
        <ellipse cx="59.5" cy="50" rx="4.5" ry="3.6" fill="currentColor"/>
        <path d="M54.2 48.8 Q59.5 44.6 64.8 48.8" stroke="currentColor" stroke-width="2.2" fill="none" stroke-linecap="round"/>
        <path d="M54.4 46.4 Q59.5 42.6 64.4 46.4" stroke="currentColor" stroke-width="1.2" fill="none"
              stroke-linecap="round" opacity=".7"/>
        <path d="M55.2 52.8 Q59.5 54.8 63.8 52.8" stroke="currentColor" stroke-width="1" fill="none"
              stroke-linecap="round" opacity=".65"/>
        <circle cx="57.8" cy="48.8" r="1.5" fill="var(--face1,#fffdf9)"/>
        <circle cx="61.7" cy="51.8" r="0.6" fill="var(--face1,#fffdf9)" opacity=".6"/>
      </g>
      <g class="eyes e-curve">
        <path d="M34.6 49.8 Q40.5 43.8 46.4 49.8" stroke="currentColor" stroke-width="2.9" fill="none" stroke-linecap="round"/>
        <path d="M53.6 49.8 Q59.5 43.8 65.4 49.8" stroke="currentColor" stroke-width="2.9" fill="none" stroke-linecap="round"/>
      </g>

      <!-- 鼻：挺直鼻梁 -->
      <path d="M50.6 43.5 L50 57 Q53.2 59.6 49 59.9" stroke="currentColor" stroke-width="1.8"
            fill="none" stroke-linecap="round" stroke-linejoin="round"/>

      <!-- 嘴：朱砂色，线稿里唯一的彩 -->
      <path class="mouth m-smile" d="M43.8 66.4 Q50 70.4 56.2 66.4"
            stroke="var(--spark,#ff7a17)" stroke-width="2.2" stroke-linecap="round"/>
      <ellipse class="mouth m-open" cx="50" cy="67.4" rx="4.8" ry="4.6" fill="var(--spark,#ff7a17)"/>
      <path class="mouth m-flat" d="M44.4 67.4 H55.6" stroke="var(--spark,#ff7a17)" stroke-width="2.2" stroke-linecap="round"/>
      <path class="mouth m-laugh" d="M42.2 64.8 Q50 74.4 57.8 64.8"
            stroke="var(--spark,#ff7a17)" stroke-width="2.4" stroke-linecap="round"/>
    </g>
  </g>
</svg>
