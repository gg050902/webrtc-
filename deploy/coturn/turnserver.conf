# coturn 最小可用配置（教学演示档；生产建议 static-auth-secret + TLS）
listening-port=3478
# 与 docker-compose 的 network_mode: host 配合，无需 external-ip；
# 若容器跑桥接网络/双网卡，请补：external-ip=<公网IP>/<内网IP>
fingerprint
lt-cred-mech                # 长期凭证机制（固定账号密码，教学最直观）
realm=webrtc-demo
user=demo:demo1234          # 演示账号：demo / demo1234（改成你自己的！）

# 中继端口段：必须在防火墙/安全组放行这段 UDP
min-port=49160
max-port=49200

# 日志（排障时调成 verbose）
verbose
# 生产建议（有域名与证书时）：
# tls-listening-port=5349
# cert=/etc/coturn/cert.pem
# pkey=/etc/coturn/key.pem
# no-tlsv1
# no-tlsv1_1
